<!-- Hidden iframe prevents page redirection upon submit -->
<script type="text/javascript">var submitted=false;</script>
<iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { document.getElementById('success-msg').style.display='block'; document.getElementById('contact-form').reset(); }"></iframe>

<!-- Custom Headless Form -->
<form id="contact-form" class="custom-form" action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSeSqLPiqxu3eQEDm912SPxSXbBBvsiYzIkUR7eBWmSX9i4Z1Q/formResponse" method="POST" target="hidden_iframe" onsubmit="submitted=true;">
    
    <h3 class="form-title">Contact Me</h3>

    <div>
        <label for="name">Full Name</label>
        <!-- Extracted ID for "Full Name" -->
        <input type="text" id="name" name="entry.2118725193" required>
    </div>

    <div>
        <label for="email">Email</label>
        <!-- Google's default name for built-in email collection -->
        <input type="email" id="email" name="emailAddress" required>
    </div>

    <div class="full-width">
        <label for="message">Message</label>
        <!-- Extracted ID for "Message" -->
        <textarea id="message" name="entry.891600162" required></textarea>
    </div>

    <button type="submit">Send Message</button>
    <div id="success-msg" class="success-msg">Message sent successfully.</div>
</form>
